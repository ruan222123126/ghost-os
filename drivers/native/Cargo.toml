[package]
name = "native"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
xcap = "0.0.10"
enigo = "0.1.2"
tokio = { version = "1.0", features = ["full"] }
pyo3 = { version = "0.22", features = ["auto-initialize"] }
libc = "0.2"
glob = "0.3"
ignore = "0.4"
regex = "1.10"
html2text = "0.12"
reqwest = { version = "0.11", default-features = false, features = ["blocking", "rustls-tls"] }
