version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - gocyclo
    - staticcheck
    - unused
  settings:
    gocyclo:
      min-complexity: 12
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gocyclo
          - unused
      - path: orchestration/envelope_generated\.go
        linters:
          - unused

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
