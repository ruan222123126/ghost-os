name: complexity-boundary-check

on:
  pull_request:
    paths:
      - "core/bridge/**"
      - "core/shared/**"
      - "drivers/native/**"
      - "apps/web/**"
      - "scripts/check_complexity_limits.py"
      - "scripts/complexity_limits_analysis.py"
      - "scripts/complexity_limits_git.py"
      - ".github/workflows/complexity-boundary-check.yml"
  push:
    branches:
      - main
    paths:
      - "core/bridge/**"
      - "core/shared/**"
      - "drivers/native/**"
      - "apps/web/**"
      - "scripts/check_complexity_limits.py"
      - "scripts/complexity_limits_analysis.py"
      - "scripts/complexity_limits_git.py"
      - ".github/workflows/complexity-boundary-check.yml"
  workflow_dispatch:

jobs:
  enforce-limits:
    name: Enforce Complexity And Layer Boundaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # PR #3 restores history that predates this gate. Check only the explicit
      # recovery merge delta; all other PRs keep the normal base...head range.
      - name: Run recovery PR complexity and boundary checks
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 3
        env:
          COMPLEXITY_DIFF_BASE: HEAD^1
        run: python3 scripts/check_complexity_limits.py

      # The one merge commit created from PR #3 needs the same narrow range on
      # main; later pushes immediately return to the standard incremental gate.
      - name: Run recovery merge complexity and boundary checks
        if: "github.event_name == 'push' && contains(github.event.head_commit.message, 'Merge pull request #3')"
        env:
          COMPLEXITY_DIFF_BASE: HEAD^2
        run: python3 scripts/check_complexity_limits.py

      - name: Run complexity and boundary checks
        if: >-
          !(
            (github.event_name == 'pull_request' && github.event.pull_request.number == 3) ||
            (github.event_name == 'push' && contains(github.event.head_commit.message, 'Merge pull request #3'))
          )
        run: python3 scripts/check_complexity_limits.py
