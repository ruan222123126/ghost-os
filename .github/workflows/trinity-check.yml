name: trinity-check

on:
  pull_request:
    paths:
      - "core/bridge/**"
      - "core/shared/**"
      - "drivers/native/**"
      - "apps/cli/src/envelope_generated.rs"
      - "apps/android/app/src/main/java/dev/ghostos/android/model/ApiModels.kt"
      - "apps/web/**"
      - "scripts/check_generated_contracts.sh"
      - ".github/workflows/trinity-check.yml"
  push:
    branches:
      - main
    paths:
      - "core/bridge/**"
      - "core/shared/**"
      - "drivers/native/**"
      - "apps/cli/src/envelope_generated.rs"
      - "apps/android/app/src/main/java/dev/ghostos/android/model/ApiModels.kt"
      - "apps/web/**"
      - "scripts/check_generated_contracts.sh"
      - ".github/workflows/trinity-check.yml"
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      bridge: ${{ steps.filter.outputs.bridge }}
      contract: ${{ steps.filter.outputs.contract }}
      native: ${{ steps.filter.outputs.native }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed layers
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            bridge:
              - 'core/bridge/**'
            contract:
              - 'core/shared/**'
              - 'core/bridge/orchestration/envelope_generated.go'
              - 'apps/web/lib/envelope.generated.ts'
              - 'apps/cli/src/envelope_generated.rs'
              - 'apps/android/app/src/main/java/dev/ghostos/android/model/ApiModels.kt'
              - 'scripts/check_generated_contracts.sh'
            native:
              - 'drivers/native/**'
            web:
              - 'apps/web/**'

  contract-check:
    name: Shared Contract Generated Sync
    needs: changes
    if: ${{ needs.changes.outputs.contract == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify generated contract files
        run: bash scripts/check_generated_contracts.sh

  bridge-check:
    name: Bridge (Go)
    needs: changes
    if: ${{ needs.changes.outputs.bridge == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: core/bridge/go.mod

      - name: Run tests
        working-directory: core/bridge
        run: timeout 60s go test ./...

  native-check:
    name: Native (Rust) / ${{ matrix.variant }}
    needs: changes
    if: ${{ needs.changes.outputs.native == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: default
            feature_args: ""
          - variant: python-sandbox
            feature_args: "--features python-sandbox"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: |
          if [ -n "${{ matrix.feature_args }}" ]; then
            timeout 60s cargo test --manifest-path drivers/native/Cargo.toml ${{ matrix.feature_args }}
          else
            timeout 60s cargo test --manifest-path drivers/native/Cargo.toml
          fi

  web-check:
    name: Web (pnpm)
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm --dir apps/web install --frozen-lockfile

      - name: Lint
        run: pnpm --dir apps/web lint

      - name: Test
        run: pnpm --dir apps/web test

      - name: Build
        run: pnpm --dir apps/web build
