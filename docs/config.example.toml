# Ghost-OS Bridge config template
# Copy this file to ~/.ghost-os/config.toml and adjust values as needed.

active_provider = "openai"
model = "gpt-4o"
# chat_path = "/chat/completions"

[providers.openai]
type = "openai"
base_url = "https://api.openai.com/v1"
api_key = "sk-your-key"
models = ["gpt-4o", "gpt-4.1-mini"]

# Codex / Responses API example
# chat_path = "/responses"
# [providers.codex]
# type = "codex"
# base_url = "https://api.openai.com/v1"
# api_key = "sk-your-key"
# models = ["codex-mini-latest"]

# OpenAI-compatible gateway example
# [providers.crs]
# type = "custom" # OpenAI-Compatible
# base_url = "https://lldai.online/openai"
# api_key = "sk-your-key"
# models = ["gpt-5.4", "gpt-4"]

# Anthropic example
# [providers.anthropic]
# type = "anthropic"
# api_key = "sk-ant-..."
# models = ["claude-3-7-sonnet-latest"]

bind_addr = "127.0.0.1:8080"
api_token = "change-me"
cors_origins = ["http://localhost:3000", "http://localhost:5173"]

sessions_path = "~/.ghost-os/sessions"
memory_warm_path = "~/.ghost-os/memory/warm.json"
memory_cold_path = "~/.ghost-os/memory/cold"
memory_ledger_path = "~/.ghost-os/memory/cold/ledger"
memory_ledger_read_enabled = false

prompts_path = "prompts.yaml"
native_persistent = false
# native_binary_path = "/abs/path/to/native"
# native_binary_roots = ["./drivers/native/target/release", "./drivers/native/target/debug"]
# native_binary_candidates = ["native", "native.exe"]

memory_auto_recall_enabled = true
memory_auto_recall_limit = 5
memory_warm_ttl = "24h"
memory_evolution_enabled = false
memory_evolution_interval = "1h"
memory_graph_enabled = false
memory_graph_path = "~/.ghost-os/memory/graph"
memory_graph_extract_on_archive = true
memory_graph_extract_on_evolve = true
memory_graph_max_hops = 1
memory_graph_max_hits = 6
memory_graph_min_confidence = 0.72
memory_graph_namespace = "default"
memory_graph_debug_enabled = false
memory_decision_enabled = false
memory_decision_capture_on_turn = true
memory_decision_path = "~/.ghost-os/memory/decision"
memory_decision_max_hits = 4
memory_decision_min_confidence = 0.75
memory_decision_min_reuse_score = 0.70
memory_decision_recipe_enabled = true
memory_decision_recipe_interval = "6h"
memory_decision_recipe_min_support = 3
memory_decision_debug_enabled = false
memory_decision_selector_hint_enabled = true
memory_decision_recipe_reuse_enabled = true
memory_decision_recipe_execution_tracking_enabled = true
memory_decision_recipe_backfill_enabled = true
memory_decision_recipe_default_enabled = true
memory_decision_recipe_default_gray_percent = 10
memory_decision_recipe_min_selection_confidence = 0.72
memory_decision_recipe_min_success_rate = 0.66
memory_decision_recipe_backfill_batch_size = 50
memory_decision_recipe_backfill_interval = "30m"

# Stable public memory surface: warm + cold/ledger + graph + decision + hygiene.
# `MEMORY_HYGIENE_RUN` now synthesizes durable rule cards from working memory /
# markdown / decision sources and feeds recall, instead of writing garbage scores.
# Experimental internals such as truth/vector/index/shadow stay intentionally out
# of the public config template during this phase.

worker_model = ""
worker_max_concurrency = 4
worker_max_files = 20
worker_max_file_chunks = 4

anthropic_version = "2023-06-01"
anthropic_max_tokens = 1024

tool_selector_enabled = false
tool_selector_mode = "llm"
# tool_selector_model = "gpt-4o-mini"
tool_selector_timeout_ms = 1500
tool_selector_confidence = 0.75
tool_selector_shadow = false
tool_selector_recent_messages = 6
# Highest priority hard constraints for tools:
# - if both lists are empty, they are inactive and normal selector behavior stays in place
# - allowlist tools are always forced into the final runnable set
# - blocklist tools are always removed from the final runnable set
# - ask_human stays always-on even if listed in tool_blocklist
# tool_allowlist = ["read_file", "search_files"]
# tool_blocklist = ["bash_exec", "script_exec"]

# Extra headers for provider requests
# [provider_headers]
# Authorization = "Bearer some-token"
# X-Custom-Header = "some-value"
