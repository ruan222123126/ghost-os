# Ghost-OS Bridge config template
# Copy this file to ~/.ghost-os/config.toml and adjust values as needed.

active_provider = "openai"
model = "gpt-4o"
# chat_path = "/chat/completions"

[providers.openai]
type = "openai"
base_url = "https://api.openai.com/v1"
api_key = "sk-your-key"
models = ["gpt-4o", "gpt-4.1-mini"]
# context_window_tokens = 128000
# response_reserve_tokens = 2000
# model_context_window_tokens = { "gpt-4o" = 128000, "gpt-4.1-mini" = 128000 }
# model_response_reserve_tokens = { "gpt-4o" = 2000 }

# Codex / Responses API example
# chat_path = "/responses"
# [providers.codex]
# type = "codex"
# base_url = "https://api.openai.com/v1"
# api_key = "sk-your-key"
# models = ["gpt-5-codex"]

# OpenAI-compatible gateway example
# [providers.crs]
# type = "custom" # OpenAI-Compatible
# base_url = "https://lldai.online/openai"
# api_key = "sk-your-key"
# models = ["gpt-5.4", "gpt-4"]

# Anthropic example
# [providers.anthropic]
# type = "anthropic"
# api_key = "sk-ant-..."
# models = ["claude-3-7-sonnet-latest"]

bind_addr = "127.0.0.1:8080"
api_token = "change-me"
cors_origins = ["http://localhost:3000", "http://localhost:5173"]

sessions_path = "~/.ghost-os/sessions"
# tasks_path = "~/.ghost-os/tasks"
# project_root = "/abs/path/to/project"
# web_search_tavily_api_key = "tvly-..."
# web_search_exa_api_key = "exa-..."
# web_rooter stays an external sidecar service. In development, run the pinned upstream server
# manually, for example from the checked out web-rooter repo with `python server.py`.
# In production, run it as a separate container or service process. Ghost-OS only calls
# `web_rooter_base_url`; it does not install Playwright/FastAPI/MCP deps or spawn the sidecar.
# Only the stateless HTTP actions are integrated, and result volume should be bounded explicitly
# with action params such as `num_results`, `max_pages`, and `fetch_abstracts`.
# web_rooter_enabled = true
# web_rooter_base_url = "http://127.0.0.1:8765"
# web_rooter_api_token = "rooter-token"
# web_rooter_timeout_ms = 90000

prompts_path = "prompts.yaml"
# Prompt section assembly (optional)
# prompts_dir = "~/.ghost-os/prompts"
# prompts_core_files = ["core_job/base.md", "core_job/runtime.md"]
# prompts_runtime_constraint_files = ["runtime/base.md"]
# prompts_response_rule_files = ["response/base.md"]
native_persistent = false
pro_max_iterations = 20
# native_binary_path = "/abs/path/to/native"
# native_binary_roots = ["./drivers/native/target/release", "./drivers/native/target/debug"]
# native_binary_candidates = ["native", "native.exe"]

worker_model = ""
worker_max_concurrency = 4
worker_max_files = 20
worker_max_file_chunks = 4

# GraphQL tool runtime: when enabled, the model must emit exactly one GraphQL
# document that maps one top-level field to one visible bridge tool.
# Native structured tool_calls are hidden from the model in this mode.
# graphql_tool_runtime_enabled = false

anthropic_version = "2023-06-01"
anthropic_max_tokens = 1024

tool_selector_enabled = false
tool_selector_mode = "llm"
# tool_selector_model = "gpt-4o-mini"
tool_selector_timeout_ms = 1500
tool_selector_confidence = 0.75
tool_selector_shadow = false
tool_selector_recent_messages = 6
# Resident tools are opt-in: only tools listed in tool_allowlist are exposed at turn start.
# Session tools loaded later still depend on their own runtime path (for example tfind when enabled and allowlisted).
# tool_allowlist_only additionally disables runtime model switching from Web/CLI.
# tool_allowlist_only = true
# Highest priority hard constraints for tools:
# - if tool_allowlist is empty, no tools are resident by default
# - allowlist tools are always forced into the final runnable set
# - blocklist tools are always removed from the final runnable set
# tool_allowlist = ["script_exec", "web_search"]
# tool_blocklist = ["web_search"]
# Workflow task tool nodes are unrestricted by default.
# Set workflow_tool_allowlist only when you need explicit restrictions.
# Tools that require an active session, such as ask_human and tfind,
# are rejected from this list at config-load time.
# workflow_tool_allowlist = ["script_exec", "web_search"]

# mem0-style memory augmentation
memory_augmentation_enabled = true
memory_augmentation_learning_enabled = true
memory_augmentation_recall_enabled = true
memory_augmentation_max_recall_items = 8
memory_augmentation_min_confidence = 0.7
memory_augmentation_session_scope_enabled = true
memory_augmentation_user_scope_enabled = true
# memory_augmentation_llm_model = "gpt-4o-mini"
memory_augmentation_user_scope_id = "local-user"

# Responses API request options (optional)
# response_prompt_cache_key = "ghost-session-cache-key"
# response_prompt_cache_retention = "retain"
# response_safety_identifier = "local-user"
# response_store = false
# response_metadata = { app = "ghost-os", channel = "bridge" }
# Enable only when you explicitly want legacy retry behavior for codex continuation 4xx.
# codex_stateless_retry_enabled = false

# Extra headers for provider requests
# [provider_headers]
# Authorization = "Bearer some-token"
# X-Custom-Header = "some-value"
